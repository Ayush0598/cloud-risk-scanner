# standards_map.yaml - maps each rule to external standards (Objective 3 of the project).
#
# SOURCES AND HOW THIS WAS PRODUCED
#   * CIS AWS Foundations Benchmark v3.0.0 : control IDs and titles matched one by one against the
#     benchmark's own control titles, as transcribed in the open-source Prowler file cis_3.0_aws.json.
#     Rules with an empty cis list have NO direct control in v3.0 (for example S3 encryption and versioning).
#   * NIST CSF 1.1 subcategories and ISO/IEC 27001:2022 Annex A controls : chosen by the team from the
#     published frameworks (names/titles taken from Prowler's nist_csf_1.1_aws.json and
#     iso27001_2022_aws.json). These are reasonable mappings, NOT official crosswalks - review before citing.
#   * OWASP Cloud Top 10 : not mapped yet.
#   * Every ID below was checked programmatically to exist in the source files.
#   Control numbers change between benchmark versions, so always cite the version.
